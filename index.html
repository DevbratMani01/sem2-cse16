<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java Script basics</title>
</head>
<body>
    <h1>Java Script basics</h1>
    <p>JavaScript is a programming language that allows you to create dynamic and interactive content on websites. It is commonly used for tasks such as form validation, creating animations, and handling user interactions.</p>
    
    <button onclick="addEmployee()">Add Employee</button>
    <button onclick="displayEmployees()">Display Employees</button>
    <button onclick="filterEmployees()">Filter Employees</button>
    <button onclick="totalsalary()">Total Salary</button>
    <button onclick="avgsalary()">Average Salary</button>
    <button onclick="countDept()">Count by Department</button>
    
    <div id="output"></div>
</body>
